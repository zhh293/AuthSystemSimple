name: SSO unit and module tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  sso-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run unit and module tests
        run: mvn -B -pl sso-server,sso-example-rp,sso-resource-example -am verify
