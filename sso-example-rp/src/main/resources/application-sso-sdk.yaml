sso:
  client:
    enabled: true
    issuer: ${SSO_ISSUER:http://localhost:8080}
    client-id: ${SSO_CLIENT_ID}
    client-secret: ${SSO_CLIENT_SECRET}
    redirect-uri: ${SSO_REDIRECT_URI:http://localhost:8082/sso/callback}
    local-store: ${SSO_LOCAL_STORE:true}
    secure-cookie: ${SSO_COOKIE_SECURE:false}
    cookie-same-site: Lax
    scopes:
      - openid
      - profile
      - email
    family-lifetime: ${SSO_REFRESH_FAMILY_LIFETIME:30d}
    refresh-skew: ${SSO_REFRESH_SKEW:30s}
    protected-paths:
      - /profile
      - /private/**
      - /sso/status
      - /logout-form
    public-paths:
      - /
      - /error
      - /sso/login
      - /sso/callback
      - /sso/logout
    status-enabled: true
server:
  address: ${SSO_RP_ADDRESS:127.0.0.1}
  port: 8082
spring:
  security:
    oauth2:
      client:
        registration:
          sso:
            client-id: ${SSO_CLIENT_ID}
            client-secret: ${SSO_CLIENT_SECRET}
