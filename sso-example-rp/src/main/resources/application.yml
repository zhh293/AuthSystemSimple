server:
  port: ${SSO_RP_PORT:8090}
  servlet:
    session:
      cookie:
        http-only: true
        secure: ${SSO_RP_COOKIE_SECURE:true}
        same-site: lax
spring:
  application:
    name: sso-example-rp
  security:
    oauth2:
      client:
        registration:
          sso:
            provider: sso
            client-id: ${SSO_RP_CLIENT_ID}
            client-secret: ${SSO_RP_CLIENT_SECRET}
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: [openid, profile, email, resource.read]
        provider:
          sso:
            issuer-uri: ${SSO_ISSUER:http://localhost:8080}
sso:
  revocation-uri: ${SSO_REVOCATION_URI:}
